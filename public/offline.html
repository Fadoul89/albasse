<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#072469" />
    <title>Pas de connexion - Albasse Shopping</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #072469;
        color: #f4efe4;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      main {
        min-height: 100%;
        box-sizing: border-box;
        padding: 24px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 16px;
      }
      h1 {
        margin: 0;
        font-family: Georgia, 'Times New Roman', serif;
        font-size: 26px;
        color: #e7c87a;
      }
      p {
        margin: 0;
        max-width: 320px;
        font-size: 15px;
        line-height: 1.5;
        color: rgba(244, 239, 228, 0.78);
      }
      button {
        margin-top: 8px;
        padding: 13px 28px;
        border: 0;
        border-radius: 999px;
        background: #c79a3e;
        color: #072469;
        font-size: 15px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Pas de connexion</h1>
      <p>Albasse Shopping a besoin d'internet pour afficher les articles. Vérifiez votre Wi-Fi ou vos données mobiles, puis réessayez.</p>
      <button type="button" onclick="location.reload()">Réessayer</button>
    </main>
    <script>
      window.addEventListener('online', function () {
        location.reload();
      });
    </script>
  </body>
</html>
