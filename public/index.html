<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0c0c0f" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Albasse" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
    <script>
      // Capture l'evenement Chrome avant que le bundle React soit charge.
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.__pwaInstallPrompt__ = e;
        window.__pwaInstallPromptAt__ = Math.round(performance.now());
      });

      // Chrome n'envoie cet evenement que si un service worker avec gestionnaire
      // « fetch » est actif (voir public/sw.js) : on l'enregistre des l'arrivee
      // sur le site, pas seulement apres l'activation des notifications.
      // Uniquement sur les navigateurs qui proposent l'installation en un tap,
      // et jamais dans la coquille de l'app Android.
      (function () {
        try {
          var inApp =
            /AlbasseShoppingApp/i.test(navigator.userAgent) ||
            /[?&]albasse_app=1/.test(window.location.search) ||
            window.localStorage.getItem('albasse_app_shell') === '1';
          if (inApp) { window.__swReg__ = 'non tente (coquille de l\'app)'; return; }
          if (!('serviceWorker' in navigator)) { window.__swReg__ = 'non tente (navigateur sans service worker)'; return; }
          if (!('onbeforeinstallprompt' in window)) { window.__swReg__ = 'non tente (navigateur sans installation en un tap)'; return; }
          window.addEventListener('load', function () {
            navigator.serviceWorker.register('/sw.js').then(
              function () { window.__swReg__ = 'enregistre'; },
              function (err) { window.__swReg__ = 'ERREUR ' + err.name + ' : ' + err.message; }
            );
          });
        } catch (e) {
          // silencieux : l'enregistrement ne doit jamais bloquer le site
        }
      })();

      // Apple ne verifie pas toujours seul si le service worker a change : on le demande
      // a chaque ouverture et a chaque retour au premier plan, pour que les nouveautes
      // (notifications) arrivent tout de suite.
      (function () {
        try {
          if (!('serviceWorker' in navigator)) return;
          function refresh() {
            navigator.serviceWorker.getRegistration().then(function (reg) {
              if (reg) return reg.update();
            }).catch(function () { /* silencieux */ });
          }
          refresh();
          document.addEventListener('visibilitychange', function () {
            if (document.visibilityState === 'visible') refresh();
          });
        } catch (e) {
          // silencieux : cela ne doit jamais bloquer le site
        }
      })();

      // Toucher d'une notification : le service worker (public/sw.js) note la page a ouvrir
      // dans un cache. Sur iPhone, Apple lance parfois l'appli sur l'accueil sans suivre
      // l'adresse demandee : c'est donc la page qui va sur la bonne fiche, a son ouverture
      // (le service worker peut ecrire quelques secondes apres) et a son retour au premier plan.
      (function () {
        try {
          if (!('caches' in window)) return;
          var KEY = '/__ouverture-notification';
          function alreadyDone(at) {
            try {
              if (window.sessionStorage.getItem('albasse_notif_done') === String(at)) return true;
              window.sessionStorage.setItem('albasse_notif_done', String(at));
            } catch (e) {
              // silencieux
            }
            return false;
          }
          function check() {
            // Un onglet cache n'est pas celui que la personne regarde : il attend son retour au premier plan.
            if (document.visibilityState === 'hidden') return;
            caches.open('albasse-notification').then(function (cache) {
              return cache.match(KEY).then(function (res) {
                if (!res) return;
                return res.json().then(function (rec) {
                  return cache.delete(KEY).then(function () {
                    if (!rec || typeof rec.url !== 'string' || Date.now() - rec.at > 120000 || alreadyDone(rec.at)) return;
                    var target = new URL(rec.url, window.location.origin);
                    if (target.origin !== window.location.origin) return;
                    if (target.pathname + target.search !== window.location.pathname + window.location.search) {
                      window.location.assign(target.href);
                    }
                  });
                });
              });
            }).catch(function () { /* silencieux */ });
          }
          function checkSoon() {
            [0, 400, 1000, 2000, 3500, 6000].forEach(function (ms) { setTimeout(check, ms); });
          }
          checkSoon();
          document.addEventListener('visibilitychange', function () {
            if (document.visibilityState === 'visible') checkSoon();
          });
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.addEventListener('message', function (e) {
              if (e.data && e.data.type === 'albasse-notification') check();
            });
          }
        } catch (e) {
          // silencieux : cela ne doit jamais bloquer le site
        }
      })();

      // Diagnostic de l'installation : ajouter ?diag=1 a l'adresse du site affiche
      // en bas de l'ecran ce que le navigateur sait faire (service worker,
      // evenement d'installation, temps passe sur la page). Rien n'est envoye.
      (function () {
        try {
          if (!/[?&]diag=1/.test(window.location.search)) return;
          var t0 = performance.now();
          var wrap = document.createElement('div');
          wrap.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:2147483647;pointer-events:none';
          var testBtn = document.createElement('button');
          testBtn.type = 'button';
          testBtn.textContent = "TESTER L'INSTALLATION DE CHROME";
          testBtn.style.cssText =
            'display:block;margin:0 8px 6px auto;padding:10px 14px;border:0;border-radius:8px;background:#c79a3e;color:#000;' +
            'font:700 13px sans-serif;pointer-events:auto';
          var box = document.createElement('pre');
          box.style.cssText =
            'margin:0;padding:6px 8px;background:rgba(0,0,0,.9);color:#9fe870;font:11px/1.35 monospace;' +
            'white-space:pre-wrap;word-break:break-all;pointer-events:none';
          wrap.appendChild(testBtn);
          wrap.appendChild(box);
          document.body.appendChild(wrap);
          // Test direct, sans passer par le code du site : appelle prompt() sur l'evenement de Chrome
          // dans le geste du toucher et affiche le resultat ou l'erreur exacte.
          var testResult = 'pas encore lance';
          testBtn.addEventListener('click', function () {
            var ev = window.__pwaInstallPrompt__;
            if (!ev) { testResult = "aucun evenement disponible (deja utilise ? rechargez la page)"; return; }
            window.__pwaInstallPrompt__ = undefined;
            testResult = 'prompt() appele (activation=' + (navigator.userActivation ? navigator.userActivation.isActive : '?') + ')...';
            try {
              ev.prompt().then(function () { return ev.userChoice; }).then(
                function (c) { testResult = 'choix : ' + c.outcome; },
                function (err) { testResult = 'ERREUR ' + err.name + ' : ' + err.message; }
              );
            } catch (err) {
              testResult = 'EXCEPTION ' + err.name + ' : ' + err.message;
            }
          });
          var actions = 0;
          ['touchstart', 'click', 'scroll'].forEach(function (n) {
            window.addEventListener(n, function () { actions++; }, { passive: true, capture: true });
          });
          var installedEvt = false;
          window.addEventListener('appinstalled', function () { installedEvt = true; });
          var related = 'non supporte';
          if (navigator.getInstalledRelatedApps) {
            related = 'en cours';
            navigator.getInstalledRelatedApps().then(
              function (a) { related = a.length ? 'OUI (' + a.length + ')' : 'aucune'; },
              function (e) { related = 'erreur ' + e.name; }
            );
          }
          var manifestInfo = 'en cours';
          fetch('/manifest.json', { cache: 'no-store' }).then(function (r) {
            return r.json().then(function (j) { manifestInfo = r.status + ' | ' + j.display + ' | ' + (j.icons || []).length + ' icones'; });
          }).catch(function (e) { manifestInfo = 'ERREUR ' + e.name; });
          var quota = '?';
          if (navigator.storage && navigator.storage.estimate) {
            navigator.storage.estimate().then(function (e) { quota = Math.round(e.quota / 1048576) + ' Mo'; });
          }
          var swInfo = 'en cours';
          function refresh() {
            var ua = navigator.userAgent;
            var chrome = (ua.match(/Chrome\/(\d+)/) || [])[1] || '-';
            var browser = /SamsungBrowser/.test(ua) ? 'Samsung Internet'
              : /EdgA|Edg\//.test(ua) ? 'Edge'
              : /OPR\//.test(ua) ? 'Opera'
              : /FBAN|FBAV|Instagram|WhatsApp|TikTok/i.test(ua) ? 'appli integree'
              : 'Chrome ' + chrome;
            var modes = ['standalone', 'minimal-ui', 'fullscreen', 'browser'].filter(function (m) {
              return window.matchMedia('(display-mode: ' + m + ')').matches;
            });
            if (navigator.serviceWorker) {
              navigator.serviceWorker.getRegistrations().then(function (rs) {
                swInfo = rs.length
                  ? rs.map(function (r) { var w = r.active || r.waiting || r.installing; return (w ? w.state : '?') + (r.active ? '' : ' (pas actif)'); }).join(', ')
                  : 'AUCUN';
              });
            }
            var at = window.__pwaInstallPromptAt__;
            box.textContent = [
              'DIAG installation | ' + Math.round((performance.now() - t0) / 1000) + ' s sur la page | actions : ' + actions,
              'Navigateur : ' + browser + (/; wv\)/.test(ua) ? ' (WebView)' : '') + ' | mobile=' + (navigator.userAgentData ? navigator.userAgentData.mobile : '?') + ' | mode : ' + (modes[0] || '?'),
              'HTTPS=' + window.isSecureContext + ' | stockage=' + quota + ' | evenement gere=' + ('onbeforeinstallprompt' in window),
              'EVENEMENT D\'INSTALLATION : ' + (at !== undefined ? 'RECU a ' + (at / 1000).toFixed(1) + ' s' : 'jamais recu') + ' | disponible=' + (window.__pwaInstallPrompt__ ? 'oui' : 'non'),
              'Dernier essai du bouton du site : ' + (window.__pwaInstallIssue__ || 'aucun'),
              'Test direct de Chrome : ' + testResult,
              'Service worker : ' + swInfo + ' | controle la page=' + (navigator.serviceWorker && navigator.serviceWorker.controller ? 'oui' : 'non'),
              'Enregistrement : ' + (window.__swReg__ || 'en attente'),
              'Manifest : ' + manifestInfo,
              'Deja installe : ' + related + ' | appinstalled=' + installedEvt
            ].join('\n');
          }
          refresh();
          setInterval(refresh, 1000);
        } catch (e) {
          // silencieux : le diagnostic ne doit jamais bloquer le site
        }
      })();
    </script>
  </body>
</html>
