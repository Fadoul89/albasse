[build]
  command = "npx expo export -p web && node scripts/generate-sitemap.js"
  publish = "dist"

[build.environment]
  # La cle Firebase dans albasse-app/google-services.json n'est pas un secret
  # (elle est faite pour etre publique, cf. doc Firebase) mais le scanner de
  # secrets de Netlify la detecte quand meme et bloquait tous les deploiements
  # depuis son ajout.
  SECRETS_SCAN_OMIT_PATHS = "albasse-app/google-services.json"

# Pages vues par Google et les réseaux sociaux : accueil, produits, catégories (netlify/edge-functions/og-preview.ts)
[[edge_functions]]
  path = "/"
  function = "og-preview"

[[edge_functions]]
  path = "/produit/*"
  function = "og-preview"

[[edge_functions]]
  path = "/categorie/*"
  function = "og-preview"

# Plan du site et robots.txt toujours à jour (netlify/edge-functions/sitemap.ts)
[[edge_functions]]
  path = "/sitemap.xml"
  function = "sitemap"

[[edge_functions]]
  path = "/robots.txt"
  function = "sitemap"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
