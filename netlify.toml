[build]
  command = "npx expo export -p web && node scripts/generate-sitemap.js && node scripts/single-page-shell.js"
  publish = "dist"

[build.environment]
  # La cle Firebase dans albasse-app/google-services.json n'est pas un secret
  # (elle est faite pour etre publique, cf. doc Firebase) mais le scanner de
  # secrets de Netlify la detecte quand meme et bloquait tous les deploiements
  # depuis son ajout.
  SECRETS_SCAN_OMIT_PATHS = "albasse-app/google-services.json"

  # Airtel Money et Moov Money sont OUVERTS (demande du patron, 15 novembre 2026). Pour les retirer de nouveau : supprimer cette ligne (docs/airtel-moov-retires.md).
  EXPO_PUBLIC_MOBILE_MONEY = "on"

# Pages vues par Google et les réseaux sociaux : accueil, produits, catégories (netlify/edge-functions/og-preview.ts)
[[edge_functions]]
  path = "/"
  function = "og-preview"

[[edge_functions]]
  path = "/produit/*"
  function = "og-preview"

[[edge_functions]]
  path = "/categorie/*"
  function = "og-preview"

# Pages d'information : leur propre titre et leur propre adresse canonique pour Google (avant : la même coquille que toutes les autres pages)
[[edge_functions]]
  path = "/contact"
  function = "og-preview"

[[edge_functions]]
  path = "/conditions-de-retour"
  function = "og-preview"

[[edge_functions]]
  path = "/conditions-generales"
  function = "og-preview"

[[edge_functions]]
  path = "/confidentialite"
  function = "og-preview"

# Vraie page 404 : une adresse qui n'existe pas reçoit le code 404 au lieu de la page d'accueil avec le code 200 (netlify/edge-functions/not-found.ts).
# Les fichiers (scripts, images, polices…) ne passent pas par cette fonction.
[[edge_functions]]
  path = "/*"
  function = "not-found"
  excludedPath = ["/_expo/*", "/assets/*", "/*.js", "/*.css", "/*.png", "/*.jpg", "/*.jpeg", "/*.gif", "/*.svg", "/*.ico", "/*.webp", "/*.json", "/*.woff", "/*.woff2", "/*.ttf", "/*.mp3", "/*.mp4", "/*.txt", "/*.xml", "/*.html"]

# Plan du site et robots.txt toujours à jour (netlify/edge-functions/sitemap.ts)
[[edge_functions]]
  path = "/sitemap.xml"
  function = "sitemap"

[[edge_functions]]
  path = "/robots.txt"
  function = "sitemap"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# --- Vitesse et sécurité (docs/liste-avant-lancement.md) ---------------------------------------------------------------------------------
# Les fichiers fabriqués par Expo portent un code dans leur nom (index-c53a….js, logo.2942….jpg) : ils ne changent jamais sous le même nom.
# Le navigateur peut donc les garder un an sans redemander au serveur (visite suivante plus rapide).
[[headers]]
  for = "/_expo/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# En-têtes de sécurité simples, sans effet visible sur le site.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
