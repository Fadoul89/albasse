[build]
  command = "npx expo export -p web && node scripts/generate-sitemap.js"
  publish = "dist"

[[edge_functions]]
  path = "/produit/*"
  function = "og-preview"

[[edge_functions]]
  path = "/categorie/*"
  function = "og-preview"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
